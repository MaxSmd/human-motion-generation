# Local-first data layout: read packed HumanML3D from the in-repo submodule.
# Default while AMASS is not yet hosted on the cluster.
#
# Override at the CLI:
#   python scripts/train.py +data=cluster_mounted

defaults: []

root: ${oc.env:RMG_DATA_ROOT,${hydra:runtime.cwd}/external/data/humanml3d_packed}
layout: submodule_zip       # how the dataset class interprets `root`
zip_name: humanml3d.zip
splits_name: splits.json
offsets_name: target_offsets.pt

# Sequence + sampling
fps: 20
max_seq_len: 196            # HumanML3D upper bound (~10 s @ 20 fps)
min_seq_len: 40
mirror_augment: true        # left/right swap augmentation (paper-standard)

# Dataloader
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 4
