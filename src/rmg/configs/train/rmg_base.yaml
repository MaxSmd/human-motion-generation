# Training config for RMG-base on a single 24g cluster GPU.
# Paper Table 7: BS 256 = 32×8×1 → emulate via micro-BS 32 + 8× grad accum.

preset: rmg_base
max_steps: 150_000
micro_batch_size: 32
grad_accum: 8                  # effective BS = 256

optimizer:
  name: AdamW
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.0
  eps: 1.0e-8

scheduler:
  warmup_ratio: 0.08
  min_lr_ratio: 0.0

grad_clip: 0.5
cfg_dropout: 0.1               # paper §4.1
prior_sigma: 1.0               # wrapped Gaussian σ

ema:
  decay: 0.9999

precision: bf16                # bf16 | fp16 | fp32

log_every: 50
ckpt_every: 5_000
sample_every: 5_000
num_sample_steps: 50           # Riemannian Euler steps for periodic samples
guidance_scale: 6.5            # paper's ω*
