# Training config for full RMG (24L/1024h) on a single 24g cluster GPU.
# Paper Table 7: BS 256 = 16×8×2 → emulate via micro-BS 16 + 16× grad accum
# (the gradient-accumulation knob lets us hit BS 256 on a single GPU).

preset: rmg_large
max_steps: 600_000
micro_batch_size: 16
grad_accum: 16                 # effective BS = 256

optimizer:
  name: AdamW
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.0
  eps: 1.0e-8

scheduler:
  warmup_ratio: 0.08
  min_lr_ratio: 0.0

grad_clip: 0.5
cfg_dropout: 0.1
prior_sigma: 1.0

ema:
  decay: 0.9999

precision: bf16

log_every: 100
ckpt_every: 10_000
sample_every: 10_000
num_sample_steps: 50
guidance_scale: 6.5
