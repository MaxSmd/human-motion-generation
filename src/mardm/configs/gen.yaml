# @package _global_
# MARDM generation branch (stage 2) — scaled-down "mini" config.
#
# Requires a trained stage-1 AE checkpoint whose `ae:` block matches the one
# below (architecture must agree to load the weights):
#   python scripts/train_mardm.py ae_checkpoint=runs/mardm-ae-XXXX/checkpoints/latest.pt
#
# Local smoke (random text encoder, CPU): see scripts/train_mardm.py docstring.

defaults:
  - /data: local_submodule
  - _self_

run_name: mardm-gen-${now:%Y%m%d-%H%M%S}
output_dir: ${oc.env:RMG_RUNS_DIR,${hydra:runtime.cwd}/runs}/${run_name}
seed: 0
deterministic: false

stats_path: ${oc.env:MARDM_STATS,${hydra:runtime.cwd}/external/data/mardm_essential_stats.pt}
ae_checkpoint: ???              # stage-1 AE checkpoint (required)
ae_use_ema: true                # load the AE's EMA weights for the frozen encoder

# Deterministic dataset subset (overfit smoke / debugging). subset_frac takes
# precedence over limit_clips. Both apply to train AND val splits.
subset_frac: null               # e.g. 0.005 -> 0.5% of clips per split
limit_clips: null               # e.g. 64    -> first 64 clips per split

# Must match the trained AE (used to rebuild the module before loading weights).
ae:
  input_width: 67
  output_emb_width: 512
  down_t: 2
  stride_t: 2
  width: 512
  depth: 3
  dilation_growth_rate: 3
  activation: relu

# MARDM-mini generation branch (~15M params; ae_dim/text_dim filled at runtime).
model:
  latent_dim: 384
  ff_size: 1024
  num_layers: 2
  num_heads: 6
  dropout: 0.2
  diffmlps_width: 512
  diffmlps_depth: 6
  diffmlps_batch_mul: 4
  cond_drop_prob: 0.1

text_encoder:
  type: qwen3                   # random (smoke) | qwen3
  text_dim: 1024
  model_name: Qwen/Qwen3-Embedding-0.6B
  cache_dir: ${oc.env:HF_HOME,${oc.env:HOME}/.cache/huggingface}
  max_length: 256

train:
  max_steps: 100_000            # placeholder for the ≤1-day budget; set via throughput probe
  micro_batch_size: 64
  grad_accum: 1
  optimizer:
    name: AdamW
    lr: 2.0e-4
    betas: [0.9, 0.99]
    weight_decay: 1.0e-5
    eps: 1.0e-8
  scheduler:
    warmup_ratio: 0.02          # ~2k steps (upstream warmup)
    min_lr_ratio: 0.1
  grad_clip: 0.5
  ema:
    decay: 0.9999
  precision: auto               # auto | bf16 | fp16 | fp32 — auto picks bf16 on Ampere+, fp16 on Turing
  log_every: 50
  ckpt_every: 5_000
  val_every: 2_000
  val_batches: 16

logging:
  use_wandb: true
  use_tensorboard: true
  wandb_project: mardm
  wandb_mode: ${oc.env:WANDB_MODE,offline}
  wandb_entity: ${oc.env:WANDB_ENTITY,null}

hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: ${output_dir}
  job:
    chdir: false
