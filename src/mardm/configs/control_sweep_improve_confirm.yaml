# 512-clip confirmation of the phase-3 winners from the 128-clip probe (jobs
# 15567/15568). FID now lines up with the phase-1 / runtime-lever tables in
# reports/maskcontrol-differences.md (512-clip unguided floor 0.268; opt30
# already there at 1.447, tol5_inline at 0.673). The unguided arm comes from
# ctrl.baseline=true.
#
# Dropped from the probe and why:
#   root_pol / root_pol_hi  — the skate polish is ill-posed: with the local
#       pose frozen you cannot cut foot skate without moving the root, which
#       breaks the waypoints (avg 0.000 -> 0.141 m, FID 1.24 -> 11.6). The
#       plain closed-form `root` is the keeper.
#   skate2 / skate20        — skate term ALONE is toxic to FID (6.0 / 7.9); it
#       only behaves when stabilized by the dynamics anchor (see dyn_skate).
#   uturn_*                 — degraded control (0.15-0.16 m) with no FID gain.
#   cfg*                    — CFG > 3.0 monotonically worsens FID; w=3.0 (the
#       existing default) confirmed optimal for the guided pass too.
#   trust15                 — looser radius, worse FID than trust05.
#
#   128-clip result  FID     avg      skate   note
#   opt30            2.867   0.016 m  0.829   optimizer-only reference
#   trust05          0.786   0.027 m  0.793   FID champion (floor 0.755)
#   dyn500           0.963   0.021 m  0.871   dynamics anchor, tight control
#   dyn_skate        1.109   0.020 m  0.497   adds skate reduction
#   combo3           0.850   0.032 m  0.523   best all-rounder / best jerk
#   root             1.241   0.000 m  0.860   EXACT control, 27x faster (45s)

- name: opt30              # optimizer-only, tolerance off (phase-1 arm, re-run for the new columns)
  tolerance: 0.0
- name: trust05            # hard trust region r=0.05*||z0|| per token
  tolerance: 0.0
  trust_radius: 0.05
- name: dyn500             # root-relative velocity anchor to an unguided sample
  tolerance: 0.0
  dyn_weight: 500.0
- name: dyn_skate          # + geometric foot-skate penalty (stable only with the anchor)
  tolerance: 0.0
  dyn_weight: 500.0
  skate_weight: 20.0
- name: combo3             # dyn + skate + trust + interleaved repair
  tolerance: 0.0
  dyn_weight: 500.0
  skate_weight: 20.0
  trust_radius: 0.15
  repair_every: 3
  repair_frac: 0.25
  repair_iters: 5
- name: root               # closed-form root-channel edit, unguided cost
  inner_iters: 0
  root_edit: true
