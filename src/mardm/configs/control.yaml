# @package _global_
# MARDM condition regularizer (spatial control, phase 2).
#
# ControlNet-style copy of the FROZEN base MARDM-M transformer; only the copy +
# control encoder + zero projections train. Requires the trained stage-1 AE and
# the stage-2 generation checkpoint (dims below must match both):
#   python -m mardm.scripts.train_mardm_control \
#       ae_checkpoint=... gen_checkpoint=... text_encoder.type=qwen3

defaults:
  - /data: local_submodule
  - _self_

run_name: mardm-control-${now:%Y%m%d-%H%M%S}
output_dir: ${oc.env:RMG_RUNS_DIR,${hydra:runtime.cwd}/runs}/${run_name}
seed: 0
deterministic: false

stats_path: ${oc.env:MARDM_STATS,${hydra:runtime.cwd}/external/data/mardm_essential_stats.pt}
ae_checkpoint: ???              # stage-1 AE checkpoint (required)
ae_use_ema: false
gen_checkpoint: ???             # stage-2 generation checkpoint (required, frozen)
gen_use_ema: true               # the eval'd MARDM-M weights are the EMA ones

subset_frac: null
limit_clips: null

# Must match the trained AE.
ae:
  input_width: 67
  output_emb_width: 512
  down_t: 2
  stride_t: 2
  width: 512
  depth: 3
  dilation_growth_rate: 3
  activation: relu

# Must match the trained generation checkpoint (MARDM-M dims, see gen_m.yaml).
model:
  latent_dim: 768
  ff_size: 3072
  num_layers: 1
  num_heads: 12
  dropout: 0.2
  diffmlps_width: 1280
  diffmlps_depth: 8
  diffmlps_batch_mul: 4
  cond_drop_prob: 0.1

control:
  alpha: 0.1                    # loss = alpha * L_diff + (1 - alpha) * L_s (MaskControl)
  cond_drop_prob: 0.1           # manual CFG dropout (frozen base won't drop)
  joints: [0, 10, 11, 15, 20, 21]  # pelvis, feet, head, wrists (OmniControl set)
  # Euler steps for the from-noise differentiable sample inside L_s. Must
  # sample from noise, NOT a GT-anchored clean estimate — the anchored variant
  # leaks the target and trains a no-op regularizer (see regularizer.py).
  ls_ode_steps: 4

text_encoder:
  type: qwen3
  text_dim: 1024
  model_name: Qwen/Qwen3-Embedding-0.6B
  cache_dir: ${oc.env:HF_HOME,${oc.env:HOME}/.cache/huggingface}
  max_length: 256

train:
  max_steps: 50_000             # placeholder for the <=1-day budget; set via throughput probe
  micro_batch_size: 96          # CAMP kills 24g jobs below ~30% VRAM after 2h — keep the card full
  grad_accum: 1
  optimizer:
    name: AdamW
    lr: 1.0e-4                  # ControlNet fine-tune range; copy starts at base weights
    betas: [0.9, 0.99]
    weight_decay: 1.0e-5
    eps: 1.0e-8
  scheduler:
    warmup_ratio: 0.02
    min_lr_ratio: 0.1
  grad_clip: 0.5
  ema:
    decay: 0.9999
  precision: auto
  log_every: 50
  ckpt_every: 5_000
  val_every: 2_000
  val_batches: 16

logging:
  use_wandb: true
  use_tensorboard: true
  wandb_project: mardm
  wandb_mode: ${oc.env:WANDB_MODE,offline}
  wandb_entity: ${oc.env:WANDB_ENTITY,null}

hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: ${output_dir}
  job:
    chdir: false
