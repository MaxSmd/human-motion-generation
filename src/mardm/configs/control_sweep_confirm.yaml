# 512-clip confirmation of the runtime-lever Pareto front found by the 8-arm
# 128-clip sweep (control_sweep.yaml, job 15149). Only the three arms that
# define the Fast / Accurate / Realism spectrum are re-run here, on the full
# 512-clip protocol, so FID lines up with the phase-1 table in
# reports/maskcontrol-differences.md (unguided floor 0.268 at 512 clips vs
# 0.755 at 128 — small-sample FID bias makes the two scales incomparable).
#
# opt30 is NOT re-run: the phase-1 table already reports it at 512 clips
# (FID 1.447, avg 0.015 m). The unguided arm comes from ctrl.baseline=true.
#
#   128-clip result   FID     avg err   gen_s
#   tol5_ramp         1.574   0.050 m     252   <- fast
#   tol5_inline       0.823   0.047 m     859   <- best realism/control balance
#   combo_all         0.565   0.114 m     299   <- cheapest, loosest control

- name: tol5_ramp          # tolerance + ramped guidance: 5x faster than opt30
  tolerance: 0.05
  guidance_start_frac: 0.33
  guidance_ramp: true
- name: tol5_inline        # tolerance + interleaved repair: the frozen-gait fix
  tolerance: 0.05
  repair_every: 3
  repair_frac: 0.25
  repair_iters: 5
- name: combo_all          # all levers + one post-hoc repair round
  tolerance: 0.05
  guidance_start_frac: 0.33
  guidance_ramp: true
  prox_weight: 0.05
  repair_every: 3
  repair_frac: 0.25
  repair_iters: 5
  repair_rounds: 1
